x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    PGHOST: db
    PGDATABASE: studio
    PGUSER: studio
    PGPASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    APP_KEY: ${APP_KEY:?isi APP_KEY}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD}
services:
  web:
    <<: *app
    expose: ["8000"]
  worker:
    <<: *app
    command: ["python","app.py"]
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    volumes: ["studio_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  studio_db:
