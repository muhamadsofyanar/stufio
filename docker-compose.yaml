x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &runtime
    PGHOST: db
    PGDATABASE: studio
    PGUSER: studio
    PGPASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    APP_KEY: ${APP_KEY:?isi APP_KEY}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?isi ADMIN_PASSWORD}
services:
  web:
    <<: *app
    environment: &social_runtime
      <<: *runtime
      SOCIAL_ORIGIN: ${SOCIAL_ORIGIN:-}
      INSTAGRAM_CONFIG_ID: ${INSTAGRAM_CONFIG_ID:-}
      INSTAGRAM_LOGIN_MODE: ${INSTAGRAM_LOGIN_MODE:-facebook}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
    expose: ["8000"]
  worker:
    <<: *app
    environment: *social_runtime
    command: ["python","app.py"]
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    volumes: ["studio_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 4s
      retries: 20
volumes:
  studio_db:
